# Alternative host TLS with nginx + certbot (Let's Encrypt).
# Replace ssl_certificate paths after certbot.

upstream voctoweb {
  server 127.0.0.1:3000;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name media.freifunk.net;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name media.freifunk.net;

  ssl_certificate     /etc/letsencrypt/live/media.freifunk.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/media.freifunk.net/privkey.pem;

  client_max_body_size 64m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection        "";
    proxy_pass http://voctoweb;
  }
}

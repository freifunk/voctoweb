# Rebase freifunk/voctoweb main onto voc/voctoweb main weekly, so the fork's
# own commits (branding, docker, CI tweaks) always sit on top of upstream.
#
# This rewrites main and force-pushes it. Never land upstream changes via a
# PR merge button ("Rebase and merge" / "Squash" rewrite upstream SHAs and
# break the shared history; that is what caused the Aug–Nov 2026 drift).
#
# On conflicts nothing is pushed: the job fails and lists the conflicting
# files. Resolve locally once:
#   git fetch voc main && git rebase voc/main   # resolve, then
#   git push --force-with-lease origin HEAD:main
name: Sync upstream

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add voc remote and fetch
        run: |
          git remote add voc https://github.com/voc/voctoweb.git 2>/dev/null || git remote set-url voc https://github.com/voc/voctoweb.git
          git fetch voc main

      - name: Rebase main onto voc/main
        id: rebase
        shell: bash
        run: |
          ORIG=$(git rev-parse HEAD)
          echo "orig=${ORIG}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor voc/main HEAD; then
            echo "Already up to date with voc/main."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rebase voc/main; then
            {
              echo "## Upstream sync: rebase conflicts"
              echo
              echo "Nothing was pushed. Conflicting files:"
              echo
              git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/'
              echo
              echo "Resolve locally: \`git fetch voc main && git rebase voc/main\`, then \`git push --force-with-lease origin HEAD:main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            git rebase --abort
            exit 1
          fi

          SHA=$(git rev-parse voc/main)
          printf 'voc/voctoweb@%s\n' "${SHA}" > UPSTREAM
          git add UPSTREAM
          if ! git diff --cached --quiet; then
            # Keep a single bump commit on top instead of piling them up.
            if git log -1 --format=%s | grep -q '^chore(sync): bump UPSTREAM'; then
              git commit --amend -m "chore(sync): bump UPSTREAM to ${SHA}"
            else
              git commit -m "chore(sync): bump UPSTREAM to ${SHA}"
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream sync: rebased onto voc/main@${SHA:0:7}"
            echo
            echo "Fork commits on top of upstream:"
            echo
            git log --format='- %h %s' voc/main..HEAD
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Force-push main
        if: steps.rebase.outputs.changed == 'true'
        # --force-with-lease: refuse if someone pushed to main during the run.
        run: git push --force-with-lease="main:${{ steps.rebase.outputs.orig }}" origin HEAD:main
